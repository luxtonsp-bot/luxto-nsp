<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial — Luz de Cristo</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/portal.css">
    <style>
        /* Estilos específicos de historial (dark theme del proyecto) */
        .filters select { min-width: 200px; }

        .summary-stats {
            display: flex; gap: 16px;
            margin-bottom: 28px; flex-wrap: wrap;
        }
        .stat-card {
            flex: 1; min-width: 150px;
            padding: 18px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px; text-align: center;
        }
        .stat-card h3 {
            margin: 0; color: var(--muted);
            font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .stat-number {
            font-family:'Lora',serif;
            font-size: 30px; font-weight: 600;
            color: var(--y); margin: 8px 0 0;
        }

        .members-table table { background: var(--bg2); }
        .members-table th {
            background: var(--bg3); color: var(--y);
            font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
            text-transform: uppercase; padding: 13px 16px;
        }
        .members-table td {
            padding: 12px 16px; font-size: 14px; color: var(--cream);
            border-top: 1px solid var(--border);
        }
        .members-table tbody tr:hover td { background: rgba(255,255,255,.03); }

        .attendance-date, .historical-table, .kahoot-date {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px; margin-bottom: 20px;
        }
        .attendance-date { border-left: 4px solid var(--b); }
        .attendance-date h3, .historical-table h3, .kahoot-date h3, .historical-section h3 {
            font-family:'Lora',serif; font-size: 17px; font-weight: 600;
            color: var(--cream); margin: 0 0 14px;
        }
        .historical-section h3 { border-bottom: 2px solid rgba(245,197,24,.35); padding-bottom: 8px; }
        .attendance-date ul, .historical-section ul { padding-left: 20px; }
        .attendance-date li { font-size: 14px; color: var(--cream); margin-bottom: 5px; }

        .table-records { max-height: 300px; overflow-y: auto; }
        .record {
            padding: 12px 14px; margin-bottom: 8px;
            background: rgba(255,255,255,.04);
            border: 1px solid var(--border); border-radius: 10px;
            font-size: 14px; color: var(--cream);
        }
        .record strong { color: var(--y); font-weight: 600; }

        .kahoot-participant {
            display: flex; justify-content: space-between; align-items: center;
            padding: 11px 0; border-bottom: 1px solid var(--border);
            font-size: 14px; color: var(--cream);
        }
        .kahoot-participant:last-child { border-bottom: none; }
        .rank { font-weight: 700; color: var(--y); min-width: 34px; }
        .nombre { flex: 1; }
        .puntos { font-weight: 700; color: #7fe8aa; min-width: 64px; text-align: right; }

        .historical-section { margin-bottom: 28px; }
        .historical-section li {
            margin-bottom: 12px; padding: 14px 16px;
            background: rgba(255,255,255,.04);
            border: 1px solid var(--border); border-radius: 10px;
            font-size: 14px; color: var(--cream);
            list-style: none;
        }
        .historical-section li strong { color: var(--y); }
        .historical-section li small { color: var(--muted); }

        @media (max-width: 768px) {
            .filters { flex-direction: column; align-items: stretch; }
            .filters select { min-width: auto; width: 100%; }
        }
    </style>
    <!-- Firebase imports (same as other pages) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

<header id="topbar">
  <div class="topbar-inner">
    <a href="dashboard.html" class="topbar-logo">
      <img src="../assets/images/logo_luxto.png" alt="Logo" onerror="this.onerror=null;this.style.display='none'">
      <span class="topbar-logo-name">Luz de Cristo</span>
    </a>
    <span class="topbar-badge">🗂️ Historial</span>
    <div class="topbar-sep"></div>
    <button class="btn-logout" onclick="cerrarSesion()">⎋ Salir</button>
  </div>
</header>

<main class="container">

    <div class="section-eyebrow">Archivo histórico</div>
    <h1>Historial de Actividades</h1>
    <p class="section-desc">Consulte los datos históricos de años anteriores, incluyendo asistencia, tablas dinámicas, rankings de asambleas y más.</p>

    <div class="card">
        <div class="card-title">🔎 Filtros</div>
        <div class="filters">
            <div>
                <label for="year-select">Seleccionar año:</label>
                <select id="year-select">
                    <option value="">-- Seleccione un año --</option>
                    <!-- Years will be populated dynamically -->
                </select>
            </div>
            <div>
                <label for="view-type">Tipo de vista:</label>
                <select id="view-type">
                    <option value="resumen">Resumen General</option>
                    <option value="asistencia">Asistencia</option>
                    <option value="tablas">Tablas Dinámicas</option>
                    <option value="kahoot">Ranking Kahoot</option>
                    <option value="sugerencias">Sugerencias y Feedback</option>
                </select>
            </div>
            <div>
                <button id="load-history-button" class="btn btn-primary">
                    📂 Cargar Historial
                </button>
            </div>
        </div>
    </div>

    <div id="history-content" style="margin-top: 6px;">
        <!-- Historical data will be displayed here -->
        <div class="empty-state">Seleccione un año y tipo de vista para cargar el historial.</div>
    </div>

</main>

<div id="toast"></div>

<script>
    // Initialize Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDLl5CLvdaSzZ_K6VXrlJzm4VvN9HQouJo",
        authDomain: "luxto-nsp.firebaseapp.com",
        projectId: "luxto-nsp",
        storageBucket: "luxto-nsp.firebasestorage.app",
        messagingSenderId: "3542836325",
        appId: "1:3542836325:web:cf65cd50edcc431500d28c",
        databaseURL: "https://luxto-nsp-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    // DOM Elements
    const yearSelect = document.getElementById('year-select');
    const viewTypeSelect = document.getElementById('view-type');
    const loadHistoryButton = document.getElementById('load-history-button');
    const historyContentDiv = document.getElementById('history-content');

    // ── Toast ──
    function toast(msg, tipo = "") {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.className = "show " + tipo;
        setTimeout(() => t.className = "", 3200);
    }

    function cerrarSesion() {
        firebase.auth().signOut().then(() => { window.location.href = 'login.html'; });
    }

    // Initialize
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            await populateYears();
            // Load default view when year changes
            yearSelect.addEventListener('change', () => {
                if (yearSelect.value) {
                    loadHistoricalData();
                } else {
                    historyContentDiv.innerHTML = '<div class="empty-state">Seleccione un año y tipo de vista para cargar el historial.</div>';
                }
            });

            // Load default view when view type changes
            viewTypeSelect.addEventListener('change', loadHistoricalData);

            // Load button click
            loadHistoryButton.addEventListener('click', loadHistoricalData);
        } else {
            window.location.href = 'login.html';
        }
    });

    // Populate available years from historical collections
    async function populateYears() {
        try {
            yearSelect.innerHTML = '<option value="">-- Seleccione un año --</option>';

            let sortedYears = [];

            try {
                // Estrategia 1: docs de año vía collectionGroup('historico')
                // (requiere que exista historico/{anio} como doc y rules de lectura)
                const historicoCollections = await db.collectionGroup('historico').get();
                const years = new Set();
                historicoCollections.forEach(doc => {
                    // The year is part of the path: historico/{year}/collection/{doc}
                    const pathParts = doc.ref.path.split('/');
                    if (pathParts.length >= 2 && pathParts[0] === 'historico') {
                        const year = pathParts[1];
                        if (!isNaN(year) && year.length === 4) {
                            years.add(parseInt(year));
                        }
                    }
                });
                sortedYears = Array.from(years).sort((a, b) => b - a);
            } catch (e1) {
                console.warn("collectionGroup('historico') falló, usando fallback:", e1.code || e1.message);
            }

            if (sortedYears.length === 0) {
                // Estrategia 2 (fallback): derivar años de las subcolecciones conocidas
                // leyendo 1 doc de cada ruta historico/{anio}/{collection}
                const years = new Set();
                // Años candidatos: desde 2020 hasta el año actual + 1
                const anioActual = new Date().getFullYear();
                const candidatos = [];
                for (let a = 2020; a <= anioActual + 1; a++) candidatos.push(String(a));

                // Probar en paralelo: cada candidato x members (la más poblada)
                const resultados = await Promise.allSettled(
                    candidatos.map(a =>
                        db.collection('historico').doc(a).collection('members').limit(1).get()
                    )
                );

                resultados.forEach((res, i) => {
                    if (res.status === 'fulfilled' && !res.value.empty) {
                        years.add(parseInt(candidatos[i]));
                    }
                });

                // Además probar sugerencias/feedback (pueden existir sin members)
                const resultados2 = await Promise.allSettled(
                    candidatos.map(a => Promise.all([
                        db.collection('historico').doc(a).collection('sugerencias').limit(1).get(),
                        db.collection('historico').doc(a).collection('feedback').limit(1).get()
                    ]))
                );
                resultados2.forEach((res, i) => {
                    if (res.status === 'fulfilled') {
                        const [sug, fee] = res.value;
                        if (!sug.empty || !fee.empty) years.add(parseInt(candidatos[i]));
                    }
                });

                sortedYears = Array.from(years).sort((a, b) => b - a);
            }

            // Populate dropdown
            sortedYears.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            });

            // If no historical data yet, show a message
            if (sortedYears.length === 0) {
                yearSelect.innerHTML += '<option value="" disabled>No hay datos históricos aún</option>';
            }

        } catch (error) {
            console.error("Error populating years:", error);
            toast('Error cargando los años históricos', 'err');
        }
    }

    // Load historical data based on filters
    async function loadHistoricalData() {
        const year = yearSelect.value;
        const viewType = viewTypeSelect.value;

        if (!year) {
            historyContentDiv.innerHTML = '<div class="empty-state">Seleccione un año para ver el historial.</div>';
            return;
        }

        historyContentDiv.innerHTML = '<div class="empty-state">Cargando historial...</div>';

        try {
            switch (viewType) {
                case 'resumen':
                    await loadHistoricalSummary(year);
                    break;
                case 'asistencia':
                    await loadHistoricalAttendance(year);
                    break;
                case 'tablas':
                    await loadHistoricalTables(year);
                    break;
                case 'kahoot':
                    await loadHistoricalKahoot(year);
                    break;
                case 'sugerencias':
                    await loadHistoricalSuggestionsFeedback(year);
                    break;
            }
        } catch (error) {
            console.error("Error loading historical data:", error);
            historyContentDiv.innerHTML = '<div class="empty-state" style="color:var(--err);">Error cargando el historial</div>';
        }
    }

    // Load historical summary
    async function loadHistoricalSummary(year) {
        try {
            // Load counts from each historical collection
            const [membersSnapshot, attendanceSnapshot, tablesSnapshot, kahootSnapshot] = await Promise.all([
                db.collection('historico').doc(year).collection('members').get(),
                db.collection('historico').doc(year).collection('asistencia').get(),
                db.collection('historico').doc(year).collection('tablas_dinamicas').get(),
                db.collection('historico').doc(year).collection('asambleas_kahoot').get()
            ]);

            let html = `
                <div class="summary-stats">
                    <div class="stat-card">
                        <h3>Miembros</h3>
                        <div class="stat-number">${membersSnapshot.size}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Asistencias</h3>
                        <div class="stat-number">${attendanceSnapshot.size}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Tablas</h3>
                        <div class="stat-number">${tablesSnapshot.size}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Kahoot</h3>
                        <div class="stat-number">${kahootSnapshot.size}</div>
                    </div>
                </div>
            `;

            historyContentDiv.innerHTML = html;

        } catch (error) {
            console.error("Error loading summary:", error);
            throw error;
        }
    }

    // Load historical attendance
    async function loadHistoricalAttendance(year) {
        try {
            const attendanceSnapshot = await db.collection('historico')
                .doc(year.toString())
                .collection('asistencia')
                .get();

            if (attendanceSnapshot.empty) {
                historyContentDiv.innerHTML = `<div class="empty-state">No hay datos de asistencia para el año ${year}.</div>`;
                return;
            }

            // Group by date
            const attendanceByDate = {};
            attendanceSnapshot.forEach(doc => {
                const data = doc.data();
                const date = data.fecha || doc.id.substring(0, 10);
                if (!attendanceByDate[date]) {
                    attendanceByDate[date] = [];
                }
                attendanceByDate[date].push({ id: doc.id, ...data });
            });

            let html = `<h2 style="font-family:'Lora',serif; font-size:22px; color:var(--cream); margin-bottom:18px;">Asistencia — Año ${year}</h2>`;

            // Sort dates descending
            const sortedDates = Object.keys(attendanceByDate).sort().reverse();

            sortedDates.forEach(date => {
                const records = attendanceByDate[date];
                const presentes = records.filter(r => r.presente).length;

                html += `
                    <div class="attendance-date">
                        <h3>📅 ${formatDate(date)}</h3>
                        <p style="font-size:14px; color:var(--muted); margin-bottom:10px;">${presentes} de ${records.length} presentes</p>
                        <ul>
                `;

                records.forEach(record => {
                    const estado = record.presente ? '✓ Presente' : '✗ Ausente';
                    const color = record.presente ? '#7fe8aa' : '#f08080';
                    html += `<li style="color:${color};">${record.nombre || record.uid || 'Miembro'}: <strong>${estado}</strong></li>`;
                });

                html += `</ul></div>`;
            });

            historyContentDiv.innerHTML = html;

        } catch (error) {
            console.error("Error loading historical attendance:", error);
            throw error;
        }
    }

    // Load historical tables
    async function loadHistoricalTables(year) {
        try {
            const tablesSnapshot = await db.collection('historico')
                .doc(year.toString())
                .collection('tablas_dinamicas')
                .get();

            if (tablesSnapshot.empty) {
                historyContentDiv.innerHTML = `<div class="empty-state">No hay tablas dinámicas para el año ${year}.</div>`;
                return;
            }

            // Group by table ID
            const tablesById = {};
            tablesSnapshot.forEach(doc => {
                const tableId = doc.id; // This would be the table definition ID
                if (!tablesById[tableId]) {
                    tablesById[tableId] = [];
                }
                tablesById[tableId].push({ id: doc.id, ...doc.data() });
            });

            let html = `<h2 style="font-family:'Lora',serif; font-size:22px; color:var(--cream); margin-bottom:18px;">Tablas Dinámicas — Año ${year}</h2>`;

            // For each table, we would need to get the definition from historical definitions
            // For now, we'll show the data we have
            Object.keys(tablesById).forEach(tableId => {
                const records = tablesById[tableId];
                html += `
                    <div class="historical-table">
                        <h3>Tabla ID: ${tableId} (${records.length} registros)</h3>
                        <div class="table-records">
                    `;

                // Show first few records as sample
                const sampleSize = Math.min(5, records.length);
                records.slice(0, sampleSize).forEach(record => {
                    html += `<div class="record">`;
                    // Show some fields - in reality we'd format based on table definition
                    Object.keys(record).forEach(key => {
                        if (!['id', 'fechaCreacion'].includes(key)) {
                            html += `<span><strong>${key}:</strong> ${record[key]} </span> · `;
                        }
                    });
                    html += `</div>`;
                });

                if (records.length > sampleSize) {
                    html += `<p style="font-size:13px; color:var(--muted); font-style:italic; margin-top:10px;">... y ${records.length - sampleSize} registros más</p>`;
                }

                html += `</div></div>`;
            });

            historyContentDiv.innerHTML = html;

        } catch (error) {
            console.error("Error loading historical tables:", error);
            throw error;
        }
    }

    // Load historical Kahoot rankings
    async function loadHistoricalKahoot(year) {
        try {
            const kahootRef = db.collection('historico').doc(year.toString()).collection('asambleas_kahoot');
            const kahootSnapshot = await kahootRef.get();

            if (kahootSnapshot.empty) {
                historyContentDiv.innerHTML = `<div class="empty-state">No hay datos de asambleas Kahoot para el año ${year}.</div>`;
                return;
            }

            // Group by date
            const kahootByDate = {};
            kahootSnapshot.forEach(doc => {
                const data = doc.data();
                const date = data.fecha || doc.id.substring(0, 10);
                if (!kahootByDate[date]) {
                    kahootByDate[date] = [];
                }
                kahootByDate[date].push({ id: doc.id, ...data });
            });

            let html = `<h2 style="font-family:'Lora',serif; font-size:22px; color:var(--cream); margin-bottom:18px;">Ranking Kahoot — Año ${year}</h2>`;

            // Sort dates descending
            const sortedDates = Object.keys(kahootByDate).sort().reverse();

            sortedDates.forEach(date => {
                const records = kahootByDate[date];
                html += `
                    <div class="kahoot-date">
                        <h3>🏆 Asamblea del ${date}</h3>
                    `;

                // Sort by points descending
                records.sort((a, b) => (b.puntos || 0) - (a.puntos || 0)).forEach((record, index) => {
                    html += `
                        <div class="kahoot-participant">
                            <span class="rank">${index + 1}.</span>
                            <span class="nombre">${record.nombre || 'Sin nombre'}</span>
                            <span class="puntos">${record.puntos || 0} pts</span>
                        </div>
                    `;
                });

                html += `</div>`;
            });

            historyContentDiv.innerHTML = html;

        } catch (error) {
            console.error("Error loading historical Kahoot:", error);
            throw error;
        }
    }

    // Load historical suggestions and feedback
    async function loadHistoricalSuggestionsFeedback(year) {
        try {
            let html = `<h2 style="font-family:'Lora',serif; font-size:22px; color:var(--cream); margin-bottom:18px;">Sugerencias y Feedback — Año ${year}</h2>`;

            // Load suggestions
            const suggestionsRef = db.collection('historico').doc(year.toString()).collection('sugerencias');
            const suggestionsSnapshot = await suggestionsRef.get();

            html += `<div class="historical-section">
                        <h3>Sugerencias (${suggestionsSnapshot.size})</h3>
                    `;

            if (suggestionsSnapshot.empty) {
                html += `<div class="empty-state">No hay sugerencias para este año.</div>`;
            } else {
                suggestionsSnapshot.forEach(doc => {
                    const data = doc.data();
                    const fecha = data.fechaCreacion ?
                        new Date(data.fechaCreacion.seconds * 1000).toLocaleString() :
                        'Fecha desconocida';
                    html += `
                        <div class="historical-section" style="margin-bottom:12px;">
                            <div style="background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:10px; padding:14px 16px; font-size:14px; color:var(--cream);">
                                <strong style="color:var(--y);">${data.tema || 'Sin tema'}</strong><br>
                                <span>${data.descripcion || 'Sin descripción'}</span><br>
                                <small style="color:var(--muted);">Por: ${data.nombre || 'Anónimo'} — ${fecha}</small>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div>`;

            // Load feedback
            const feedbackRef = db.collection('historico').doc(year.toString()).collection('feedback');
            const feedbackSnapshot = await feedbackRef.get();

            html += `<div class="historical-section">
                        <h3>Feedback (${feedbackSnapshot.size})</h3>
                    `;

            if (feedbackSnapshot.empty) {
                html += `<div class="empty-state">No hay feedback para este año.</div>`;
            } else {
                feedbackSnapshot.forEach(doc => {
                    const data = doc.data();
                    const fecha = data.fechaCreacion ?
                        new Date(data.fechaCreacion.seconds * 1000).toLocaleString() :
                        'Fecha desconocida';
                    html += `
                        <div style="background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:10px; padding:14px 16px; font-size:14px; color:var(--cream); margin-bottom:12px;">
                            <strong style="color:var(--y);">Asamblea:</strong> ${data.asambleaFecha || 'No especificada'}<br>
                            <strong style="color:var(--y);">Comentario:</strong> ${data.comentario || 'Sin comentario'}<br>
                            <strong style="color:var(--y);">Calificación:</strong> ${'⭐'.repeat(data.puntuacion || 0)}${'☆'.repeat(5 - (data.puntuacion || 0))}<br>
                            <small style="color:var(--muted);">Por: ${data.nombre || 'Anónimo'} — ${fecha}</small>
                        </div>
                    `;
                });
            }
            html += `</div>`;

            historyContentDiv.innerHTML = html;

        } catch (error) {
            console.error("Error loading historical suggestions/feedback:", error);
            throw error;
        }
    }

    // Helper function to format date
    function formatDate(dateString) {
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        return new Date(dateString).toLocaleDateString('es-ES', options);
    }
</script>
</body>
</html>
