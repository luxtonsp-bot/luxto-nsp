<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomar Asistencia — Luz de Cristo</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/portal.css">
    <!-- Firebase imports (same as other pages) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script>
        // Convertir URL de Drive a thumbnail (igual que dashboard)
        function convertirUrlDrive(url) {
            if (!url) return "";
            if (url.includes("drive.google.com/thumbnail")) return url;
            const m = url.match(/[?&]id=([a-zA-Z0-9_-]{20,})/)
                   || url.match(/\/d\/([a-zA-Z0-9_-]{20,})/)
                   || url.match(/\/file\/d\/([a-zA-Z0-9_-]{20,})/);
            if (m) return "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w400";
            return url;
        }
    </script>
</head>
<body>

<header id="topbar">
  <div class="topbar-inner">
    <a href="dashboard.html" class="topbar-logo">
      <img src="../assets/images/logo_luxto.png" alt="Logo" onerror="this.onerror=null;this.style.display='none'">
      <span class="topbar-logo-name">Luz de Cristo</span>
    </a>
    <span class="topbar-badge">✅ Asistencia</span>
    <div class="topbar-sep"></div>
    <button class="btn-logout" onclick="cerrarSesion()">⎋ Salir</button>
  </div>
</header>

<main class="container">

    <div class="section-eyebrow">Control de asistencia</div>
    <h1>Tomar Asistencia</h1>
    <p class="section-desc">Busca un miembro y marca su asistencia. Los que no se marquen al finalizar quedan como ausentes.</p>

    <div class="card" id="current-assembly-info">
        <div class="item">Cargando información de la asamblea...</div>
    </div>

    <div class="card">
        <div class="card-title">🔍 Buscar miembro</div>
        <div class="form-row">
            <div style="flex:1;">
                <input type="text" id="member-search" placeholder="Buscar miembro por nombre...">
            </div>
            <div style="flex:0;">
                <button id="search-button" class="btn btn-primary">Buscar</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">👥 Miembros</div>
        <div id="members-list" class="item-list">
            <div class="empty-state">Busca un miembro para comenzar</div>
        </div>
    </div>

    <div class="card" id="attendance-actions" style="display: none;">
        <div class="card-title">Acciones de asistencia</div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button id="mark-present" class="btn btn-ok">✓ Marcar como presente</button>
            <button id="mark-absent" class="btn btn-secondary">✗ Marcar como ausente</button>
            <button id="finalize-attendance" class="btn btn-danger">🏁 Finalizar Asistencia</button>
        </div>
    </div>

</main>

<div id="toast"></div>

<script>
    // Initialize Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDLl5CLvdaSzZ_K6VXrlJzm4VvN9HQouJo",
        authDomain: "luxto-nsp.firebaseapp.com",
        projectId: "luxto-nsp",
        storageBucket: "luxto-nsp.firebasestorage.app",
        messagingSenderId: "3542836325",
        appId: "1:3542836325:web:cf65cd50edcc431500d28c",
        databaseURL: "https://luxto-nsp-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    // ── Zona horaria Lima (UTC-5) ──
    const LIMA_OFFSET_MIN = -300; // UTC-5 en minutos (Perú no tiene DST)

    function getLimaDateStr() {
        // Retorna YYYY-MM-DD en zona Lima
        const now = new Date();
        const lima = new Date(now.getTime() + LIMA_OFFSET_MIN * 60 * 1000);
        return lima.toISOString().split('T')[0];
    }

    let currentMember = null;
    let currentAssemblyDate = null;

    // DOM Elements
    const memberSearchInput = document.getElementById('member-search');
    const searchButton = document.getElementById('search-button');
    const membersListDiv = document.getElementById('members-list');
    const attendanceActionsDiv = document.getElementById('attendance-actions');
    const markPresentBtn = document.getElementById('mark-present');
    const markAbsentBtn = document.getElementById('mark-absent');
    const finalizeAttendanceBtn = document.getElementById('finalize-attendance');
    const currentAssemblyInfoDiv = document.getElementById('current-assembly-info');

    // ── Toast ──
    function toast(msg, tipo = "") {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.className = "show " + tipo;
        setTimeout(() => t.className = "", 3200);
    }

    function cerrarSesion() {
        firebase.auth().signOut().then(() => { window.location.href = 'login.html'; });
    }

    // Initialize
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            await loadCurrentAssembly();
            await loadMembers();
        } else {
            window.location.href = 'login.html';
        }
    });

    // Load current assembly (today's assembly in Lima timezone)
    async function loadCurrentAssembly() {
        try {
            // Get today's date in YYYY-MM-DD format (Lima timezone)
            const dateStr = getLimaDateStr();

            currentAssemblyDate = dateStr;

            const assemblyDoc = await db.collection('asambleas').doc(dateStr).get();

            if (assemblyDoc.exists) {
                const data = assemblyDoc.data();
                if (data.hayAsamblea) {
                    currentAssemblyInfoDiv.innerHTML = `
                        <div class="card-title">📅 Asamblea de hoy</div>
                        <div class="item" style="background:rgba(45,186,111,.08); border-color:rgba(45,186,111,.25);">
                            <div class="item-title" style="color:#7fe8aa;">🟢 Asamblea activa</div>
                            <div class="item-meta">
                                ${data.tema?.titulo ? `Tema: <strong>${data.tema.titulo}</strong> · ` : ''}
                                ${data.horaInicio ? `Hora: <strong>${data.horaInicio}</strong>` : ''}
                                ${(!data.tema?.titulo && !data.horaInicio) ? 'Sin detalles adicionales' : ''}
                            </div>
                        </div>
                    `;
                } else {
                    currentAssemblyInfoDiv.innerHTML = `
                        <div class="card-title">📅 Asamblea de hoy</div>
                        <div class="item" style="background:rgba(212,136,26,.08); border-color:rgba(212,136,26,.25);">
                            <div class="item-title" style="color:#f0b060;">🟡 Asamblea programada pero no activada</div>
                            <div class="item-meta">Actívala desde <a href="planificacion.html" style="color:#f0b060;">Planificación</a></div>
                        </div>
                    `;
                }
            } else {
                // Buscar próxima asamblea activa en los próximos 14 días
                let nextAssemblyInfo = null;
                const todayLima = new Date();
                todayLima.setTime(todayLima.getTime() + LIMA_OFFSET_MIN * 60 * 1000);

                for (let i = 1; i <= 14; i++) {
                    const checkDate = new Date(todayLima);
                    checkDate.setDate(checkDate.getDate() + i);
                    const checkStr = checkDate.toISOString().split('T')[0];
                    try {
                        const doc = await db.collection('asambleas').doc(checkStr).get();
                        if (doc.exists && doc.data().hayAsamblea) {
                            nextAssemblyInfo = { date: checkStr, data: doc.data() };
                            break;
                        }
                    } catch (e) {}
                }

                if (nextAssemblyInfo) {
                    const nextDateFormatted = formatDate(nextAssemblyInfo.date);
                    currentAssemblyInfoDiv.innerHTML = `
                        <div class="card-title">📅 Próxima asamblea programada</div>
                        <div class="item" style="background:rgba(245,197,24,.08); border-color:rgba(245,197,24,.25);">
                            <div class="item-title" style="color:#f5c518;">📆 Asamblea programada para el ${nextDateFormatted}</div>
                            <div class="item-meta">
                                ${nextAssemblyInfo.data.tema?.titulo ? `Tema: <strong>${nextAssemblyInfo.data.tema.titulo}</strong> · ` : ''}
                                ${nextAssemblyInfo.data.horaInicio ? `Hora: <strong>${nextAssemblyInfo.data.horaInicio}</strong>` : ''}
                            </div>
                            <div class="item-meta" style="margin-top:8px; font-size:13px; color:var(--muted);">
                                La asistencia se habilitará automáticamente ese día.
                            </div>
                        </div>
                    `;
                } else {
                    currentAssemblyInfoDiv.innerHTML = `
                        <div class="card-title">📅 Asamblea de hoy</div>
                        <div class="empty-state">No hay asamblea programada para hoy (${formatDate(dateStr)})</div>
                    `;
                }
            }
        } catch (error) {
            console.error("Error loading assembly:", error);
            currentAssemblyInfoDiv.innerHTML = '<div class="empty-state" style="color:var(--err);">Error cargando asamblea</div>';
        }
    }

    // Load members (search)
    async function loadMembers(searchTerm = '') {
        try {
            let query;
            if (searchTerm) {
                // Search by name (case-insensitive prefix match)
                query = db.collection('members')
                    .orderBy('nombre')
                    .startAt(searchTerm.charAt(0).toUpperCase() + searchTerm.slice(1))
                    .endAt(searchTerm.charAt(0).toUpperCase() + searchTerm.slice(1) + '\uf8ff');
            } else {
                query = db.collection('members').orderBy('nombre');
            }

            const snapshot = await query.limit(50).get();
            displayMembers(snapshot);
        } catch (error) {
            console.error("Error loading members:", error);
            membersListDiv.innerHTML = '<div class="empty-state" style="color:var(--err);">Error cargando miembros</div>';
        }
    }

    // Display members list
    function displayMembers(snapshot) {
        if (snapshot.empty) {
            membersListDiv.innerHTML = '<div class="empty-state">No se encontraron miembros</div>';
            return;
        }

        // Helper: valida que sea URL real (http/https/data:), no UID ni string vacía
        function isValidImageUrl(url) {
            return typeof url === 'string' && url.length > 0 && (url.startsWith('http') || url.startsWith('data:'));
        }

        let html = '';
        snapshot.forEach(doc => {
            const data = doc.data();
            const nombre = data.nombre || data.name || 'Sin nombre';
            const email = data.email || '';
            const initial = nombre.charAt(0).toUpperCase();
            // Avatar: fotoThumb (Firestore) → fotoDriveId (Drive) → fallback a inicial
            let photoUrl = data.fotoThumb;
            if (!isValidImageUrl(photoUrl) && data.fotoDriveId) {
                photoUrl = convertirUrlDrive(data.fotoDriveId);
            }
            // Validación final: solo usar si es URL real
            const hasValidPhoto = isValidImageUrl(photoUrl);
            const avatarHtml = hasValidPhoto
                ? `<img src="${photoUrl}" alt="${nombre}" style="width:40px; height:40px; border-radius:50%; object-fit:cover; flex-shrink:0;" onerror="this.onerror=null; this.src=''; this.style.display='none'; this.nextElementSibling.style.display='flex';">`
                : '';
            const initialHtml = hasValidPhoto
                ? `<div style="width:40px; height:40px; border-radius:50%; background:var(--bg3); display:none; align-items:center; justify-content:center; color:var(--y); font-weight:700; flex-shrink:0;">${initial}</div>`
                : `<div style="width:40px; height:40px; border-radius:50%; background:var(--bg3); display:flex; align-items:center; justify-content:center; color:var(--y); font-weight:700; flex-shrink:0;">${initial}</div>`;

            html += `
                <div class="item" style="display:flex; align-items:center; justify-content:space-between; gap:16px;">
                    <div style="display:flex; align-items:center; gap:12px; flex:1;">
                        ${avatarHtml}
                        ${initialHtml}
                        <div>
                            <div class="item-title">${nombre}</div>
                            ${email ? `<div class="item-meta">${email}</div>` : ''}
                        </div>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-ok" style="padding:8px 16px; font-size:13px;" onclick="markAttendance('${doc.id}', '${nombre}', true)">✓</button>
                        <button class="btn btn-danger" style="padding:8px 16px; font-size:13px;" onclick="markAttendance('${doc.id}', '${nombre}', false)">✗</button>
                    </div>
                </div>
            `;
        });

        membersListDiv.innerHTML = html;
    }

    // Calcula tardanza contra horaInicio de asambleas/{fecha}
    // Usa serverTimestamp del servidor (UTC) — zona horaria Lima (UTC-5), tolerancia 10 min
    const TOLERANCIA_TARDANZA_MIN = 10;

    async function calcularTardanza(attendanceRef, fechaAsamblea) {
        const snap = await attendanceRef.get();
        const arrival = snap.data() && snap.data().timestamp;
        if (!arrival) return;
        const assemblyDoc = await db.collection('asambleas').doc(fechaAsamblea).get();
        if (!assemblyDoc.exists) return;
        const assemblyData = assemblyDoc.data();
        if (!assemblyData.horaInicio) return;

        // serverTimestamp viene en UTC. Convertir a minutos desde medianoche en zona horaria Lima (UTC-5)
        const arrivalDate = arrival.toDate ? arrival.toDate() : new Date(arrival);
        // Usar getUTCHours/getUTCMinutes para obtener la hora UTC real, luego aplicar offset Lima
        const arrivalUTCHours = arrivalDate.getUTCHours();
        const arrivalUTCMinutes = arrivalDate.getUTCMinutes();
        const arrivalTotalUTCMinutes = arrivalUTCHours * 60 + arrivalUTCMinutes;
        // Lima = UTC - 5 horas = UTC - 300 min
        const arrivalMinutes = arrivalTotalUTCMinutes + LIMA_OFFSET_MIN;
        // Normalizar a 0-1439 (minutos del día en Lima)
        const normalizedArrivalMinutes = ((arrivalMinutes % 1440) + 1440) % 1440;

        // Hora de inicio en minutos (ya está en hora Lima)
        const [h, m] = assemblyData.horaInicio.split(':').map(Number);
        const startMinutes = h * 60 + m;

        let diff = normalizedArrivalMinutes - startMinutes;
        if (diff < -720) diff += 1440;   // cruce de medianoche hacia adelante
        else if (diff > 720) diff -= 1440;
        const tardanzaMinutos = Math.max(0, diff);

        console.log('[TARDANZA DEBUG]', {
            arrivalUTC: `${arrivalUTCHours}:${arrivalUTCMinutes}`,
            arrivalTotalUTCMinutes,
            LIMA_OFFSET_MIN,
            arrivalMinutes,
            normalizedArrivalMinutes,
            startMinutes,
            diff,
            tardanzaMinutos,
            horaInicio: assemblyData.horaInicio
        });

        await attendanceRef.set({
            tardanzaMinutos,
            esTardanza: tardanzaMinutos > TOLERANCIA_TARDANZA_MIN
        }, { merge: true });
    }

    // Mark attendance
    async function markAttendance(memberId, memberName, present) {
        try {
            if (!currentAssemblyDate) {
                toast('No hay asamblea activa hoy', 'err');
                return;
            }

            const anio = currentAssemblyDate.slice(0, 4);
            const attendanceRef = db.collection('asistencia').doc(anio).collection(currentAssemblyDate).doc(memberId);
            await attendanceRef.set({
                uid: memberId,
                presente: present,
                fecha: currentAssemblyDate,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            // Si es presente, calcular tardanza
            if (present) {
                await calcularTardanza(attendanceRef, currentAssemblyDate);
            }

            toast(`${memberName}: ${present ? '✓ Presente' : '✗ Ausente'}`, present ? 'ok' : '');
        } catch (error) {
            console.error("Error marking attendance:", error);
            toast('Error al marcar asistencia', 'err');
        }
    }

    // Search button
    searchButton.addEventListener('click', () => {
        const term = memberSearchInput.value.trim();
        loadMembers(term);
    });

    // Enter key in search
    memberSearchInput.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') {
            const term = memberSearchInput.value.trim();
            loadMembers(term);
        }
    });

    // Finalize attendance
    finalizeAttendanceBtn.addEventListener('click', async () => {
        if (!confirm('¿Finalizar la asistencia? Los miembros no marcados quedarán como ausentes.')) {
            return;
        }

        try {
            if (!currentAssemblyDate) {
                alert('No hay asamblea activa hoy');
                return;
            }

            // Get all members
            const membersSnapshot = await db.collection('members').get();
            const allMemberIds = [];
            membersSnapshot.forEach(doc => allMemberIds.push(doc.id));

            // Get already marked attendance for today
            const attendanceSnapshot = await db.collection('asistencia')
                .doc(currentAssemblyDate.slice(0, 4))
                .collection(currentAssemblyDate)
                .get();
            const markedIds = new Set();
            attendanceSnapshot.forEach(doc => markedIds.add(doc.id));

            // Mark unmarked members as absent (solo estadoAnioActual == 'activo')
            const batch = db.batch();
            let absentCount = 0;
            for (const memberId of allMemberIds) {
                if (!markedIds.has(memberId)) {
                    // Verificar que el miembro esté activo
                    const memberDoc = await db.collection('members').doc(memberId).get();
                    const memberData = memberDoc.data();
                    if (memberData && memberData.estadoAnioActual === 'activo') {
                        const docRef = db.collection('asistencia')
                            .doc(currentAssemblyDate.slice(0, 4))
                            .collection(currentAssemblyDate)
                            .doc(memberId);
                        batch.set(docRef, {
                            uid: memberId,
                            presente: false,
                            fecha: currentAssemblyDate,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                            tardanzaMinutos: null,
                            esTardanza: false
                        }, { merge: true });
                        absentCount++;
                    }
                }
            }

            await batch.commit();
            toast(`Asistencia finalizada. ${absentCount} miembros registrados como ausentes.`, 'ok');

            // Reset UI
            currentMember = null;
            attendanceActionsDiv.style.display = 'none';
            membersListDiv.innerHTML = '<div class="empty-state">Asistencia finalizada. Recarga la página para tomar nueva asistencia.</div>';

        } catch (error) {
            console.error("Error finalizing attendance:", error);
            toast('Error al finalizar asistencia', 'err');
        }
    });

    // Helper function to format date
    function formatDate(dateString) {
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        return new Date(dateString).toLocaleDateString('es-ES', options);
    }
</script>
</body>
</html>
