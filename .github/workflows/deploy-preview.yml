name: Deploy Preview

on:
  push:
    branches:
      - feature/firebase-migration

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Create environment if it doesn't exist
        run: |
          # Check if environment exists
          response=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/environments/github-pages)
          if [ "$response" -ne 200 ]; then
            # Create environment
            curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/environments \
              -d '{"name":"github-pages"}'
          fi

      - name: Prepare preview folder
        run: |
          mkdir -p preview/feature-firebase-migration
          cp -r * preview/feature-firebase-migration/ || true
          cp -r .* preview/feature-firebase-migration/ 2>/dev/null || true
          # Remove the preview folder from itself to avoid recursion
          rm -rf preview/feature-firebase-migration/preview

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview/feature-firebase-migration

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4