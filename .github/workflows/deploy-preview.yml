name: Deploy Preview

on:
  push:
    branches:
      - feature/firebase-migration

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare preview folder
        run: |
          mkdir -p preview/feature-firebase-migration
          cp -r * preview/feature-firebase-migration/ || true
          cp -r .* preview/feature-firebase-migration/ 2>/dev/null || true
          # Remove the preview folder from itself to avoid recursion
          rm -rf preview/feature-firebase-migration/preview

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview/feature-firebase-migration

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4